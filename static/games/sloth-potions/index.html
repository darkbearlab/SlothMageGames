<!DOCTYPE html>
<html lang="zh-tw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧪%3C/text%3E%3C/svg%3E">
<title>樹懶法師的分裝魔藥 | Sloth Potions</title>
<meta name="description" content="把混在一起的魔藥倒回同色的瓶子裡。關卡全部由程式生成並保證有解，還有一個永遠打不完的無盡模式。">
<style>
:root{
  --bg:#0e1020;--panel:#181c33;--panel2:#222741;--line:#333a5c;
  --text:#e9ecff;--dim:#8d96c4;--gold:#ffd45e;--ok:#5fe0a0;--bad:#ff6b8a;--acc:#8ab4ff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'Noto Sans TC',-apple-system,'Segoe UI',system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---- 頂列 ---- */
#top{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:14px;
  border-bottom:1px solid var(--line);background:rgba(10,12,26,.9);z-index:5;flex-wrap:wrap}
#top .lg{font-weight:900;color:var(--acc);white-space:nowrap}
#top .sp{flex:1}
.chip{font-size:12px;color:var(--dim);white-space:nowrap;
  border:1px solid var(--line);border-radius:20px;padding:3px 10px;background:var(--panel)}
.chip b{color:var(--text)}
#top button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;
  padding:8px 12px;font-size:13px;cursor:pointer;font-weight:700;white-space:nowrap;min-height:36px}
#top button:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
#top button:disabled{opacity:.35;cursor:default}
#btnUndo b{color:var(--gold)}

/* ---- 主選單 ---- */
#menu{flex:1;overflow-y:auto;padding:24px 16px 40px}
.mwrap{max-width:760px;margin:0 auto}
.htitle{text-align:center}
.htitle h1{font-size:clamp(24px,5.6vw,40px);margin:0;letter-spacing:1px;
  background:linear-gradient(180deg,#eaf0ff,#8ab4ff 60%,#7a5cff);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent}
.htitle .sub{font-size:11px;letter-spacing:5px;color:var(--dim);margin-top:8px}
.blurb{font-size:13px;line-height:1.95;color:#b3bce4;text-align:center;margin:18px auto 24px;max-width:520px}
.mcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.mcard{border:2px solid var(--line);border-radius:16px;padding:18px;background:var(--panel);
  cursor:pointer;transition:.14s;position:relative;overflow:hidden}
.mcard:hover{transform:translateY(-4px);border-color:var(--acc);box-shadow:0 14px 30px rgba(0,0,0,.5)}
.mcard .big{font-size:38px;line-height:1}
.mcard h3{margin:8px 0 5px;font-size:18px}
.mcard p{margin:0;font-size:12.5px;color:var(--dim);line-height:1.8}
.mcard .prog{margin-top:11px;font-size:11.5px;color:var(--ok);font-weight:700}
.mcard .tagline{position:absolute;top:11px;right:13px;font-size:10px;color:var(--dim);letter-spacing:2px}
.mnote{margin-top:22px;font-size:12px;color:var(--dim);line-height:1.9;
  border-left:2px solid var(--line);padding-left:12px}

/* ---- 遊戲畫面 ---- */
#stage{flex:1;display:flex;flex-direction:column;min-height:0}
#board{flex:1;position:relative;min-height:0}
#cv{display:block;width:100%;height:100%;touch-action:none}
#msg{text-align:center;font-size:12.5px;color:var(--dim);padding:4px 12px 10px;min-height:20px;line-height:1.6}
#msg.warn{color:var(--gold)}

/* ---- 彈窗 ---- */
#modal{position:fixed;inset:0;background:rgba(6,8,18,.93);z-index:30;display:flex;align-items:center;
  justify-content:center;padding:18px;overflow:auto}
.mbox{max-width:460px;width:100%;background:linear-gradient(180deg,#1d2240,#12152a);
  border:1px solid var(--line);border-radius:20px;padding:26px 26px 22px;text-align:center;animation:pop .22s}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.mbox h1{margin:0 0 6px;font-size:25px;color:var(--acc)}
.mbox .sub{font-size:11px;letter-spacing:5px;color:var(--dim);margin-bottom:15px}
.mbox p,.mbox li{font-size:13px;line-height:1.95;color:#b3bce4;text-align:left}
.mbox ul{padding-left:20px;margin:8px 0}
.mbox b{color:var(--gold)}
.stats{display:flex;gap:10px;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
.stat{border:1px solid var(--line);border-radius:12px;padding:9px 16px;background:var(--panel);min-width:88px}
.stat .v{font-size:21px;font-weight:900;color:var(--gold)}
.stat .k{font-size:10.5px;color:var(--dim);letter-spacing:1px;margin-top:2px}
.bigbtn{display:block;width:100%;margin-top:13px;padding:14px;border-radius:12px;
  background:linear-gradient(180deg,#2f3a66,#1c2240);border:1px solid #4a5a9c;color:#dce6ff;
  font-size:15px;font-weight:800;letter-spacing:2px;cursor:pointer}
.bigbtn:hover{border-color:var(--acc);color:#fff}
.subbtn{display:block;width:100%;margin-top:8px;padding:11px;border-radius:11px;background:var(--panel2);
  border:1px solid var(--line);color:var(--text);font-size:13px;font-weight:700;cursor:pointer}
.subbtn:hover{border-color:var(--acc);color:var(--acc)}
.togrow{display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px solid var(--line);border-radius:11px;padding:10px 14px;margin-top:9px;background:var(--panel)}
.togrow span{font-size:13px}
.tog{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:20px;
  padding:5px 14px;font-size:12px;font-weight:700;cursor:pointer;min-width:56px}
.tog.on{border-color:var(--ok);color:var(--ok)}

#toasts{position:fixed;top:64px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;
  gap:6px;align-items:center;z-index:25;pointer-events:none}
.toast{background:rgba(10,12,26,.96);border:1px solid var(--acc);color:var(--acc);border-radius:9px;
  padding:7px 15px;font-size:13px;font-weight:700;animation:tin .2s}
.toast.bad{border-color:var(--bad);color:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}

@media(max-width:700px){
  #top{padding:6px 9px;gap:7px;font-size:12px;flex-wrap:nowrap}
  #top button{padding:8px 10px;font-size:12px}
  .chip{padding:3px 8px;font-size:11px}
  .mbox{padding:20px 18px 18px}
}
/* 再窄一點就只留圖示，讓頂列維持一排 */
@media(max-width:620px){
  #top .lbl{display:none}
  #top button{padding:8px 11px;font-size:15px;min-width:42px}
  #top{gap:5px;padding:6px 7px}
  .chip{padding:3px 7px;font-size:11px}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="lg">🧪<span class="lbl"> 分裝魔藥</span></span>
    <span class="chip" id="cLevel">關卡 1</span>
    <span class="chip" id="cMoves">步數 <b>0</b></span>
    <span class="sp"></span>
    <button id="btnUndo">↩<span class="lbl"> 復原</span></button>
    <button id="btnHint">💡<span class="lbl"> 提示</span></button>
    <button id="btnRestart">⟳<span class="lbl"> 重來</span></button>
    <button id="btnMenu">☰<span class="lbl"> 選單</span></button>
  </div>

  <!-- 主選單 -->
  <div id="menu">
    <div class="mwrap">
      <div class="htitle">
        <h1>樹懶法師的分裝魔藥</h1>
        <div class="sub">S L O T H &nbsp; P O T I O N S</div>
      </div>
      <p class="blurb">
        法師熬了一整年的魔藥，然後把它們全倒進同一批瓶子裡就睡著了。<br>
        把每種顏色倒回自己的瓶子——<b style="color:var(--gold)">一瓶湊齊同色就會被收走</b>，
        收到桌上一瓶不剩為止。
      </p>
      <div class="mcards" id="modeCards"></div>
      <div class="mnote" id="menuNote"></div>
    </div>
  </div>

  <!-- 遊戲 -->
  <div id="stage" class="hidden">
    <div id="board"><canvas id="cv"></canvas></div>
    <div id="msg"></div>
  </div>
</div>

<div id="toasts"></div>
<div id="modal" class="hidden"><div class="mbox" id="mbox"></div></div>

<script src="js/logic.js"></script>
<script src="js/game.js"></script>
</body>
</html>
