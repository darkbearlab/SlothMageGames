<!DOCTYPE html>
<html lang="zh-tw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%83%8F%3C/text%3E%3C/svg%3E">
<title>樹懶法師：睡前牌局 | Sloth Deck</title>
<meta name="description" content="卡牌構築 roguelike：40 張卡、16 種遺物、分支地圖與三位守關者。在瀏覽器裡直接玩。">
<style>
:root{
  --bg:#100d16;--panel:#191423;--panel2:#221b30;--line:#332a45;
  --text:#e9e3f2;--dim:#8e85a3;--gold:#ffd45e;--hp:#e2564a;--block:#6fa8ff;
  --energy:#ffcf5e;--acc:#c48cff;--atk:#ff8a6b;--skl:#7fb8ff;--pwr:#9fe08a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'Noto Sans TC',-apple-system,'Segoe UI',system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
.dim{color:var(--dim)}
button{font-family:inherit}

#app{position:fixed;inset:0;display:flex;flex-direction:column;
  background:radial-gradient(ellipse at 50% 0%,#1a1428,#0c0a12 70%)}

/* ---- 頂列 ---- */
#hud{height:52px;display:flex;align-items:center;gap:14px;padding:0 14px;
  border-bottom:1px solid var(--line);background:rgba(12,10,18,.8);font-size:14px;flex-wrap:wrap}
#hud .lg{font-weight:900;color:var(--acc);white-space:nowrap}
.pill{display:flex;align-items:center;gap:5px;font-weight:700;white-space:nowrap}
.pill.hp{color:var(--hp)} .pill.g{color:var(--gold)} .pill.f{color:var(--acc)}
#hud .sp{flex:1}
#hud button{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:7px;padding:6px 12px;font-size:13px;cursor:pointer;font-weight:700}
#hud button:hover{border-color:var(--acc);color:var(--acc)}
#relics{display:flex;gap:5px;flex-wrap:wrap}
.relic{width:28px;height:28px;border-radius:50%;background:var(--panel2);border:1px solid #5a4a7a;
  display:flex;align-items:center;justify-content:center;font-size:15px;cursor:help}

/* ---- 地圖 ---- */
#map{flex:1;overflow:auto;padding:24px 12px 40px;position:relative}
#mapInner{position:relative;margin:0 auto;width:min(760px,96vw)}
.node{position:absolute;width:52px;height:52px;border-radius:12px;background:var(--panel);
  border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;
  transform:translate(-50%,-50%);transition:.14s;z-index:2}
.node.avail{border-color:var(--acc);cursor:pointer;box-shadow:0 0 16px rgba(196,140,255,.35)}
.node.avail:hover{transform:translate(-50%,-50%) scale(1.12)}
.node.done{opacity:.4}
.node.cur{border-color:var(--gold);box-shadow:0 0 20px rgba(255,212,94,.5)}
.node .lbl{position:absolute;bottom:-16px;font-size:9px;color:var(--dim);white-space:nowrap}
#mapSvg{position:absolute;inset:0;width:100%;height:100%;z-index:1}
#mapTitle{text-align:center;margin-bottom:8px;font-size:13px;letter-spacing:3px;color:var(--dim)}

/* ---- 戰鬥 ---- */
#battle{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden}
#field{flex:1;display:flex;align-items:flex-end;justify-content:space-around;padding:20px 20px 46px;gap:20px;
  position:relative;min-height:0;
  background:radial-gradient(ellipse 80% 40% at 50% 100%,rgba(120,80,190,.16),transparent 70%)}
#field::after{content:'';position:absolute;left:6%;right:6%;bottom:34px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(196,140,255,.28),transparent)}
.side{display:flex;gap:26px;align-items:flex-end}
.actor{position:relative;text-align:center;transition:.18s}
.actor.dead{opacity:0;transform:scale(.6)}
.actor .body{font-size:60px;line-height:1;filter:drop-shadow(0 8px 10px rgba(0,0,0,.75));
  transition:transform .12s}
.actor::after{content:'';position:absolute;left:50%;bottom:52px;transform:translateX(-50%);
  width:70px;height:12px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(3px);z-index:-1}
.actor.hit .body{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px) rotate(-6deg)}
  75%{transform:translateX(9px) rotate(6deg)}}
.actor .name{font-size:12px;font-weight:700;margin-top:4px}
.bar{width:104px;height:12px;background:#2a2135;border:1px solid #443657;border-radius:6px;
  margin:3px auto 0;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff6b5a,#a02020);transition:width .25s}
.bar span{position:absolute;inset:0;font-size:9px;line-height:12px;text-align:center;font-weight:700;
  text-shadow:0 1px 2px #000}
.blockbadge{position:absolute;left:-6px;bottom:22px;background:#1e3a68;border:2px solid var(--block);
  color:#cfe4ff;border-radius:50%;width:28px;height:28px;font-size:12px;font-weight:900;
  display:flex;align-items:center;justify-content:center}
.intent{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:13px;
  background:rgba(15,12,22,.9);border:1px solid var(--line);border-radius:14px;padding:3px 9px;
  white-space:nowrap;font-weight:700}
.buffs{display:flex;gap:3px;justify-content:center;margin-top:4px;flex-wrap:wrap}
.buff{font-size:10px;border:1px solid var(--line);border-radius:10px;padding:1px 6px;background:rgba(0,0,0,.35)}
.actor.target{cursor:pointer}
.actor.target:hover .body{transform:scale(1.12)}
.actor.targetable{outline:2px dashed rgba(255,140,90,.7);outline-offset:6px;border-radius:8px}

.float{position:absolute;font-weight:900;pointer-events:none;animation:fl 1s forwards;z-index:5;
  text-shadow:0 2px 4px #000}
@keyframes fl{0%{opacity:1;transform:translateY(0) scale(.8)}
  30%{transform:translateY(-14px) scale(1.15)}100%{opacity:0;transform:translateY(-46px)}}

/* ---- 手牌 ---- */
#handbar{border-top:1px solid var(--line);background:rgba(12,10,18,.86);padding:8px 10px 10px;
  display:flex;align-items:flex-end;gap:12px}
#energy{width:64px;height:64px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%,#5a4a10,#241c06);border:3px solid var(--energy);
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;color:#ffe9a8;
  box-shadow:0 0 18px rgba(255,207,94,.3)}
#hand{flex:1;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;min-height:150px;align-items:flex-end}
.card{width:118px;height:158px;border-radius:11px;padding:8px 8px 6px;cursor:pointer;position:relative;
  background:linear-gradient(180deg,#2a2138,#1a1526);border:2px solid var(--line);
  transition:transform .13s,box-shadow .13s;display:flex;flex-direction:column;flex:none}
.card:hover{transform:translateY(-14px) scale(1.04);box-shadow:0 12px 28px rgba(0,0,0,.6);z-index:4}
.card.sel{transform:translateY(-20px) scale(1.06);box-shadow:0 0 0 2px var(--gold),0 12px 28px rgba(0,0,0,.6)}
.card.unplayable{opacity:.45;cursor:not-allowed}
.card.attack{border-color:#7a3f2f} .card.skill{border-color:#2f4f7a} .card.power{border-color:#3f6b32}
.card .cost{position:absolute;top:-9px;left:-9px;width:26px;height:26px;border-radius:50%;
  background:#3a2f10;border:2px solid var(--energy);color:#ffe9a8;font-size:13px;font-weight:900;
  display:flex;align-items:center;justify-content:center}
.card .cn{font-size:12px;font-weight:900;text-align:center;margin-bottom:5px;line-height:1.25}
.card .art{height:38px;border-radius:6px;margin-bottom:5px;display:flex;align-items:center;
  justify-content:center;font-size:22px}
.card.attack .art{background:linear-gradient(180deg,#4a2418,#2a1410)}
.card.skill .art{background:linear-gradient(180deg,#18304a,#101c2a)}
.card.power .art{background:linear-gradient(180deg,#1e3a18,#12200e)}
.card .cd{font-size:10.5px;line-height:1.45;color:#c7bcd8;flex:1}
.card .cd b{color:#fff}
.card .ct{position:absolute;bottom:3px;right:6px;font-size:9px;color:var(--dim)}
.card.upg .cn{color:var(--gold)}

#piles{display:flex;flex-direction:column;gap:6px;flex:none;align-items:center}
.pile{width:64px;padding:6px 0;border:1px solid var(--line);border-radius:8px;text-align:center;
  font-size:11px;background:var(--panel);cursor:pointer}
.pile b{display:block;font-size:15px;color:var(--acc)}
#endturn{padding:14px 10px;border-radius:10px;border:2px solid #6a4a9c;background:linear-gradient(180deg,#3a2a5c,#221838);
  color:#e0c0ff;font-weight:900;font-size:14px;cursor:pointer;width:78px;letter-spacing:1px}
#endturn:hover{border-color:var(--acc);color:#fff}
#endturn:disabled{opacity:.4;cursor:default}

/* ---- 疊層面板 ---- */
#overlay{position:fixed;inset:0;background:rgba(6,4,10,.9);z-index:30;display:flex;
  align-items:center;justify-content:center;padding:18px;overflow:auto}
.panel{background:linear-gradient(180deg,#221b30,#150f1e);border:2px solid var(--line);
  border-radius:14px;padding:24px 28px;max-width:860px;width:100%;animation:pin .2s}
@keyframes pin{from{opacity:0;transform:translateY(12px)}to{opacity:1}}
.panel h2{margin:0 0 6px;font-size:22px;color:var(--gold);text-align:center;letter-spacing:2px}
.panel .ps{text-align:center;color:var(--dim);font-size:12px;margin-bottom:18px}
.cardrow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{background:linear-gradient(180deg,#2c2440,#1c1628);color:var(--text);border:2px solid #40355a;
  border-radius:9px;padding:11px 22px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:1px}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.primary{background:linear-gradient(180deg,#3d2a5e,#241839);border-color:#6a4a9c;color:#e0c0ff}
.row-c{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.deckgrid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-height:60vh;overflow-y:auto;padding:6px}
.relicrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.relicbig{border:1px solid #5a4a7a;border-radius:10px;padding:10px 14px;background:var(--panel);
  font-size:12px;max-width:230px;cursor:pointer}
.relicbig .rn{font-weight:900;color:var(--gold);font-size:13px}
.relicbig:hover{border-color:var(--acc)}

#tip{position:fixed;z-index:60;pointer-events:none;background:rgba(10,8,16,.97);border:1px solid var(--line);
  border-radius:8px;padding:8px 11px;font-size:12px;max-width:250px;line-height:1.6}
#toasts{position:fixed;top:64px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;
  gap:6px;align-items:center;z-index:50;pointer-events:none}
.toast{background:rgba(12,8,18,.95);border:1px solid var(--acc);color:var(--acc);border-radius:7px;
  padding:6px 14px;font-size:13px;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}

@media(max-width:760px){
  .card{width:94px;height:132px;padding:6px}
  .card .cn{font-size:11px} .card .cd{font-size:9.5px}
  .card:hover{transform:none;box-shadow:none}
  .card.sel{transform:translateY(-8px) scale(1.04)}
  .actor .body{font-size:42px}
  .actor::after{width:50px;bottom:46px}
  .bar{width:84px}
  #hud{height:auto;padding:5px 8px;gap:7px;font-size:12px}
  #hud button{padding:4px 9px;font-size:12px}
  .relic{width:24px;height:24px;font-size:13px}
  #field{padding:12px 4px 32px;gap:6px}
  .side{gap:8px;flex-wrap:wrap;justify-content:center}
  .actor{min-width:78px}
  #field::after{bottom:24px}
  /* 手牌改成一列可橫向捲動，其餘控制項排在下面 */
  #handbar{flex-wrap:wrap;padding:6px 6px 8px;gap:6px}
  #hand{order:1;flex:1 0 100%;width:100%;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
    justify-content:flex-start;min-height:138px;padding:4px 2px 6px;-webkit-overflow-scrolling:touch}
  #energy{order:2;width:46px;height:46px;font-size:15px;border-width:2px}
  #piles{order:3;flex-direction:row;gap:6px;flex:1}
  .pile{width:auto;flex:1;padding:5px 0;font-size:10px}
  .pile b{font-size:13px}
  #endturn{order:4;width:auto;flex:1;padding:9px 6px;font-size:13px}
  .panel{padding:16px 14px}
  .deckgrid{gap:6px;max-height:52vh}
  .cardrow{gap:8px}
  .row-c button{min-width:0 !important;font-size:13px;padding:9px 14px}
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#100d16}
::-webkit-scrollbar-thumb{background:#3a2f4e;border-radius:5px}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span class="lg">🦥 睡前牌局</span>
    <span class="pill hp">❤ <span id="hHp">0/0</span></span>
    <span class="pill g">💰 <span id="hGold">0</span></span>
    <span class="pill f">🗺 <span id="hFloor">0</span></span>
    <span id="relics"></span>
    <span class="sp"></span>
    <button id="btnDeck">牌組</button>
    <button id="btnHelp">說明</button>
    <button id="btnNew">重新開始</button>
  </div>

  <div id="map">
    <div id="mapTitle"></div>
    <div id="mapInner"><svg id="mapSvg"></svg></div>
  </div>

  <div id="battle" class="hidden">
    <div id="field">
      <div class="side" id="playerSide"></div>
      <div class="side" id="enemySide"></div>
    </div>
    <div id="handbar">
      <div id="energy">0/0</div>
      <div id="hand"></div>
      <div id="piles">
        <div class="pile" id="pDraw">抽牌<b>0</b></div>
        <div class="pile" id="pDisc">棄牌<b>0</b></div>
      </div>
      <button id="endturn">結束<br>回合</button>
    </div>
  </div>
</div>

<div id="toasts"></div>
<div id="tip" class="hidden"></div>
<div id="overlay" class="hidden"></div>

<script src="js/game.js"></script>
</body>
</html>
