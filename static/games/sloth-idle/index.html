<!DOCTYPE html>
<html lang="zh-tw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧘%3C/text%3E%3C/svg%3E">
<title>樹懶法師的放置修行 | Sloth Idle</title>
<meta name="description" content="關掉分頁它也會繼續修行。放置型魔力累積遊戲：10 種產能建築、頓悟轉生、成就與離線收益。">
<style>
:root{
  --bg:#0f0d18;--panel:#191527;--panel2:#221c34;--line:#2f2748;
  --text:#e9e4f6;--dim:#8d84a8;--mana:#8ab6ff;--gold:#ffd45e;--insight:#c48cff;--ok:#7fe0a0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'Noto Sans TC',-apple-system,'Segoe UI',system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  background:radial-gradient(ellipse at 20% 0%,#1b1630,#0c0a14 65%)}

#top{height:50px;display:flex;align-items:center;gap:14px;padding:0 14px;font-size:14px;
  border-bottom:1px solid var(--line);background:rgba(10,8,16,.75);flex-wrap:wrap}
#top .lg{font-weight:900;color:var(--insight);white-space:nowrap}
#top .sp{flex:1}
#top button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:7px;
  padding:6px 12px;font-size:12px;cursor:pointer;font-weight:700}
#top button:hover{border-color:var(--insight);color:var(--insight)}

#body{flex:1;display:flex;min-height:0}
#left{width:290px;flex:none;padding:16px 14px;border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;overflow-y:auto}
#mana{font-size:32px;font-weight:900;color:var(--mana);text-shadow:0 0 22px rgba(138,182,255,.35);
  line-height:1.2;text-align:center;word-break:break-all}
#manaLbl{font-size:11px;color:var(--dim);letter-spacing:3px;margin-bottom:2px}
#rate{font-size:13px;color:var(--ok);margin-top:2px}
#sloth{margin:14px 0 8px;font-size:74px;cursor:pointer;transition:transform .08s;
  filter:drop-shadow(0 8px 16px rgba(0,0,0,.6));line-height:1}
#sloth:active{transform:scale(.92)}
#clickInfo{font-size:12px;color:var(--dim);text-align:center;line-height:1.6}
.statbox{width:100%;margin-top:14px;border-top:1px solid var(--line);padding-top:10px;font-size:12px}
.srow{display:flex;justify-content:space-between;padding:2px 0}
.srow span{color:var(--dim)}
#prestige{width:100%;margin-top:14px;padding:12px;border:1px solid #4a3a6a;border-radius:10px;
  background:linear-gradient(180deg,#241a38,#181026);text-align:center}
#prestige .t{font-size:13px;font-weight:900;color:var(--insight)}
#prestige .d{font-size:11px;color:var(--dim);line-height:1.6;margin:6px 0}
#pBtn{width:100%;padding:9px;border-radius:8px;border:1px solid #6a4a9c;
  background:linear-gradient(180deg,#3d2a5e,#241839);color:#e0c0ff;font-weight:700;cursor:pointer;font-size:13px}
#pBtn:disabled{opacity:.4;cursor:default}

#right{flex:1;display:flex;flex-direction:column;min-width:0}
#tabs{display:flex;gap:6px;padding:10px 14px 0}
.tab{padding:7px 16px;border-radius:9px 9px 0 0;border:1px solid var(--line);border-bottom:none;
  background:var(--panel);cursor:pointer;font-size:13px;font-weight:700;color:var(--dim)}
.tab.on{background:var(--panel2);color:var(--text);border-color:var(--insight)}
#panes{flex:1;overflow-y:auto;padding:12px 14px 20px;border-top:1px solid var(--line)}

.gen{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:11px;
  padding:10px 12px;margin-bottom:8px;background:var(--panel);cursor:pointer;transition:.12s}
.gen:hover{border-color:var(--mana);transform:translateX(2px)}
.gen.poor{opacity:.5;cursor:not-allowed}
.gen.locked{display:none}
.gen .ic{font-size:28px;width:40px;text-align:center;flex:none}
.gen .info{flex:1;min-width:0}
.gen .gn{font-weight:900;font-size:14px;display:flex;gap:8px;align-items:center}
.gen .gn small{color:var(--dim);font-weight:400;font-size:11px}
.gen .gd{font-size:11px;color:var(--dim);line-height:1.5}
.gen .buy{text-align:right;flex:none}
.gen .cost{font-weight:900;color:var(--gold);font-size:13px}
.gen .own{font-size:22px;font-weight:900;color:var(--text);line-height:1.1}
.gen .ownl{font-size:10px;color:var(--dim)}

#buyrow{display:flex;gap:6px;margin-bottom:10px;align-items:center}
#buyrow span{font-size:12px;color:var(--dim);margin-right:4px}
.bq{padding:8px 13px;min-height:34px;border-radius:7px;border:1px solid var(--line);background:var(--panel);
  color:var(--text);font-size:12px;cursor:pointer;font-weight:700}
.bq.on{border-color:var(--gold);color:var(--gold)}

.up{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;
  padding:9px 11px;margin-bottom:7px;background:var(--panel);cursor:pointer;transition:.12s}
.up:hover{border-color:var(--gold)}
.up.poor{opacity:.45;cursor:not-allowed}
.up .ic{font-size:22px;width:30px;text-align:center}
.up .un{font-weight:900;font-size:13px}
.up .ud{font-size:11px;color:var(--dim);line-height:1.5}
.up .uc{margin-left:auto;color:var(--gold);font-weight:900;font-size:13px;white-space:nowrap}
.up.done{border-color:#3a6b4a;opacity:.6;cursor:default}
.ach{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:20px;
  padding:5px 12px;margin:0 6px 6px 0;font-size:12px;background:var(--panel);opacity:.4}
.ach.on{opacity:1;border-color:var(--gold);color:var(--gold)}
.emptynote{color:var(--dim);font-size:13px;padding:14px;text-align:center}

#float{position:fixed;pointer-events:none;z-index:20}
.fx{position:absolute;font-weight:900;color:var(--mana);animation:fu 1s forwards;text-shadow:0 2px 4px #000}
@keyframes fu{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-52px)}}

#modal{position:fixed;inset:0;background:rgba(6,4,12,.92);z-index:30;display:flex;align-items:center;
  justify-content:center;padding:20px;overflow:auto}
.mbox{max-width:560px;background:linear-gradient(180deg,#221c34,#141020);border:1px solid var(--line);
  border-radius:16px;padding:26px 30px}
.mbox h1{margin:0 0 4px;font-size:26px;color:var(--insight)}
.mbox .sub{font-size:11px;letter-spacing:5px;color:var(--dim);margin-bottom:14px}
.mbox p,.mbox li{font-size:13px;line-height:1.9;color:#c3bad8}
.mbox b{color:var(--gold)}
.bigbtn{display:block;width:100%;margin-top:16px;padding:12px;border-radius:10px;
  background:linear-gradient(180deg,#3d2a5e,#241839);border:1px solid #6a4a9c;color:#e0c0ff;
  font-size:15px;font-weight:700;letter-spacing:2px;cursor:pointer}
.bigbtn:hover{border-color:var(--insight);color:#fff}
#toasts{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;
  gap:6px;align-items:flex-end;z-index:25;pointer-events:none}
.toast{background:rgba(12,8,20,.95);border:1px solid var(--insight);color:var(--insight);
  border-radius:7px;padding:6px 14px;font-size:13px}
@media(max-width:800px){
  #body{flex-direction:column}
  #left{width:100%;border-right:none;border-bottom:1px solid var(--line);padding:10px;
    flex-direction:row;flex-wrap:wrap;justify-content:center;gap:10px;align-items:center;max-height:44vh}
  #sloth{font-size:52px;margin:0}
  #mana{font-size:24px}
  .statbox,#prestige{width:100%;margin-top:6px}
  #top{height:auto;padding:6px 10px;gap:8px}
}
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-track{background:#0f0d18}
::-webkit-scrollbar-thumb{background:#332a4e;border-radius:5px}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="lg">🧘 放置修行</span>
    <span style="color:var(--insight);font-weight:700">✦ 悟性 <span id="hIns">0</span></span>
    <span style="color:var(--dim);font-size:12px" id="hMul"></span>
    <span class="sp"></span>
    <button id="btnHelp">說明</button>
    <button id="btnReset">重置存檔</button>
  </div>
  <div id="body">
    <div id="left">
      <div style="text-align:center">
        <div id="manaLbl">魔 力</div>
        <div id="mana">0</div>
        <div id="rate">+0 /秒</div>
      </div>
      <div id="sloth">🦥</div>
      <div id="clickInfo"></div>
      <div class="statbox" id="stats"></div>
      <div id="prestige">
        <div class="t">✦ 頓悟</div>
        <div class="d" id="pDesc"></div>
        <button id="pBtn">頓悟轉生</button>
      </div>
    </div>
    <div id="right">
      <div id="tabs">
        <div class="tab on" data-t="gen">修行設施</div>
        <div class="tab" data-t="up">升級</div>
        <div class="tab" data-t="ach">成就</div>
      </div>
      <div id="panes"></div>
    </div>
  </div>
</div>
<div id="float"></div>
<div id="toasts"></div>
<div id="modal">
  <div class="mbox" id="mbox">
    <h1>樹懶法師的放置修行</h1>
    <div class="sub">S L O T H &nbsp; I D L E</div>
    <p>樹懶法師的修行方式是：<b>什麼都不做。</b></p>
    <p>點擊樹懶可以手動累積魔力，但真正的力量來自那些替你修行的東西——蒲團、法陣、學徒、
      甚至是一整座會自己運轉的星辰觀測台。</p>
    <ul>
      <li>買下設施，它們會<b>自動產生魔力</b></li>
      <li>魔力累積到一定程度可以<b>頓悟轉生</b>：一切歸零，但獲得永久的悟性加成</li>
      <li><b>關掉分頁它也會繼續修行</b>（離線收益，最多累積 8 小時，可升級）</li>
      <li>進度自動存檔在這台裝置上</li>
    </ul>
    <button class="bigbtn" id="btnStart">開始（不）修行</button>
  </div>
</div>
<script src="js/game.js"></script>
</body>
</html>
