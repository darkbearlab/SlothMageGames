<!DOCTYPE html>
<html lang="zh-tw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%97%A1%EF%B8%8F%3C/text%3E%3C/svg%3E">
<title>樹懶法師：深淵輪迴 | Sloth Abyss</title>
<meta name="description" content="一款在瀏覽器裡玩的 Diablo-like roguelite：程序生成地城、隨機掉寶、天賦組建、五位深淵之王。">
<style>
:root{
  --gold:#ffd45e; --blood:#e2564a; --mana:#5a8cff; --soul:#8fd3ff;
  --panel:#14121c; --panel2:#1c1926; --line:#2e2a3d; --text:#e8e4f0; --dim:#8a8398;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#07070b;
  font-family:'Noto Sans TC',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;color:var(--text);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas#game{position:fixed;inset:0;display:block;cursor:crosshair;touch-action:none}
.hidden{display:none !important}
.dim{color:var(--dim)}
.small{font-size:.8em}
.center{text-align:center}

/* ============ HUD ============ */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.orb{position:absolute;bottom:18px;width:104px;height:104px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#2a2436,#0d0b14);
  border:3px solid #3a3450;overflow:hidden;box-shadow:0 0 22px rgba(0,0,0,.8),inset 0 0 20px rgba(0,0,0,.9)}
#orbHp{left:18px}
#orbMp{right:18px}
.orb .fill{position:absolute;left:0;bottom:0;width:100%;transition:height .18s ease-out}
#hpFill{background:linear-gradient(180deg,#ff6b5a,#8c1c14)}
#mpFill{background:linear-gradient(180deg,#6ba8ff,#132b8c)}
.orb .gloss{position:absolute;inset:0;background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.28),transparent 55%)}
.orb .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;text-shadow:0 1px 3px #000;letter-spacing:.5px}

#topbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);text-align:center;width:min(460px,60vw)}
#xpBar{height:7px;background:#191622;border:1px solid #322c44;border-radius:4px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.6)}
#xpFill{height:100%;background:linear-gradient(90deg,#ffd45e,#ff9a3c);transition:width .25s}
#topInfo{display:flex;justify-content:space-between;font-size:12px;margin-top:4px;color:#cfc8dd;text-shadow:0 1px 3px #000}
#floorText{color:var(--gold);font-weight:700}

#resbar{position:absolute;top:10px;left:14px;font-size:14px;font-weight:700;text-shadow:0 1px 3px #000;line-height:1.7}
#resbar .g{color:var(--gold)}
#resbar .s{color:var(--soul)}

#minimapWrap{position:absolute;top:8px;right:8px;border:2px solid #3a3450;border-radius:6px;
  background:rgba(8,6,14,.7);padding:2px;box-shadow:0 3px 12px rgba(0,0,0,.7)}
#minimap{display:block;width:150px;height:150px;image-rendering:pixelated}

#buffs{position:absolute;bottom:140px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.buff{border:1px solid;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:700;
  background:rgba(10,8,16,.75);text-shadow:0 1px 2px #000}

#skillbar{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
.skill{position:relative;width:54px;height:54px;border:2px solid #443c5c;border-radius:8px;
  background:linear-gradient(180deg,#221e2e,#15121d);display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.7);transition:transform .1s,border-color .15s}
.skill:hover{transform:translateY(-3px);border-color:var(--gold)}
.skill.basic{border-color:#5a5270}
.skill.nomana{border-color:#4a3a5c;filter:saturate(.4) brightness(.7)}
.sk-icon{font-size:24px;filter:drop-shadow(0 1px 3px #000)}
.sk-key{position:absolute;bottom:1px;right:4px;font-size:9px;color:#a89ec0;font-weight:700}
.sk-mana{position:absolute;top:1px;left:4px;font-size:9px;color:#7fa8ff;font-weight:700}
.sk-count{position:absolute;bottom:2px;left:4px;font-size:11px;color:#ff8fa0;font-weight:700}
.sk-cd{position:absolute;left:0;bottom:0;width:100%;height:0%;background:rgba(10,8,20,.78);
  border-radius:0 0 6px 6px;transition:height .08s linear}

#potionSlots{position:absolute;bottom:22px;left:136px;display:flex;gap:8px}
.pot{width:40px;height:40px;border:2px solid #443c5c;border-radius:6px;background:#191523;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px}
.pot span{font-size:10px;font-weight:700}

#bossbar{position:absolute;top:52px;left:50%;transform:translateX(-50%);width:min(560px,70vw);text-align:center}
#bossName{font-size:14px;font-weight:700;color:#ff8c6b;text-shadow:0 2px 4px #000;margin-bottom:3px;letter-spacing:1px}
#bossTrack{height:12px;background:#160d10;border:2px solid #5a2a26;border-radius:3px;overflow:hidden}
#bossFill{height:100%;width:100%;background:linear-gradient(90deg,#ff5a3c,#8c1414);transition:width .2s}

#banner{position:absolute;top:32%;left:0;right:0;text-align:center;pointer-events:none}
#banner.fade{animation:bannerFade 2.6s ease-out forwards}
@keyframes bannerFade{0%{opacity:0;transform:translateY(18px)}18%{opacity:1;transform:translateY(0)}
  70%{opacity:1}100%{opacity:0}}
.bn-floor{font-size:15px;letter-spacing:6px;color:var(--gold);text-shadow:0 2px 8px #000}
.bn-name{font-size:38px;font-weight:900;letter-spacing:3px;text-shadow:0 4px 18px #000,0 0 30px rgba(255,140,60,.4)}

#toasts{position:absolute;top:120px;right:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.toast{border:1px solid;border-radius:4px;padding:6px 12px;font-size:13px;font-weight:700;
  background:rgba(10,8,16,.85);animation:tin .3s ease-out;text-shadow:0 1px 2px #000}
.toast.out{opacity:0;transform:translateX(20px);transition:.5s}
@keyframes tin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}

#upgradeFlash{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:22px;font-weight:900;color:#7bff9b;text-shadow:0 0 20px rgba(120,255,150,.6)}
#upgradeFlash.anim{animation:upFlash 1.5s ease-out}
@keyframes upFlash{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}
  25%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%)}}

/* ============ 面板 ============ */
#overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:rgba(5,4,10,.82);backdrop-filter:blur(3px);overflow:auto;padding:20px}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);
  border-radius:12px;padding:26px 30px;max-width:560px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.05);animation:pin .22s ease-out}
.panel.wide{max-width:1080px}
@keyframes pin{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.panel-title{margin:0 0 18px;font-size:22px;letter-spacing:2px;text-align:center;color:var(--gold);
  text-shadow:0 2px 10px rgba(255,180,60,.25)}
h3{margin:14px 0 8px;font-size:13px;letter-spacing:2px;color:var(--dim);text-transform:uppercase}

.btn{background:linear-gradient(180deg,#2a2438,#1c1826);color:var(--text);border:2px solid #3d3550;
  border-radius:8px;padding:11px 20px;font-size:14px;font-weight:700;cursor:pointer;
  font-family:inherit;transition:.12s;letter-spacing:1px}
.btn:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-2px)}
.btn.primary{background:linear-gradient(180deg,#4a2c1c,#2c1a12);border-color:#8a5a2c;color:#ffd9a0}
.btn.primary:hover{border-color:var(--gold);box-shadow:0 0 18px rgba(255,180,60,.3)}
.btn.danger:hover{border-color:#ff5a5a;color:#ff8a8a}
.btn.big{padding:14px 26px;font-size:16px}
.btn.small{padding:6px 12px;font-size:12px}
.menu-btns{display:flex;flex-direction:column;gap:10px;align-items:stretch;max-width:320px;margin:0 auto}
.row-center{display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap}

/* 標題 */
.title-panel{max-width:640px;text-align:center;background:linear-gradient(180deg,#1a1526,#0d0b14)}
.game-logo{margin-bottom:26px}
.logo-sub{font-size:10px;letter-spacing:5px;color:var(--dim);margin-bottom:8px}
.game-logo h1{margin:0;font-size:clamp(28px,6vw,44px);letter-spacing:2px;
  background:linear-gradient(180deg,#fff2d0,#ff9a3c 60%,#c0392b);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 12px rgba(255,120,40,.35))}
.logo-en{font-size:12px;letter-spacing:8px;color:#7a6f92;margin-top:6px}
.title-stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:22px;font-size:12px;color:var(--dim)}
.title-stats .win{color:var(--gold)}

/* 職業選擇 */
.cls-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.cls-card{border:2px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.03),transparent);cursor:pointer;transition:.15s}
.cls-card:hover{border-color:var(--c);transform:translateY(-4px);box-shadow:0 10px 26px rgba(0,0,0,.6)}
.cls-card.locked{opacity:.45;cursor:not-allowed}
.cls-name{font-size:19px;font-weight:900;color:var(--c)}
.cls-tag{font-size:9px;letter-spacing:3px;color:var(--dim);margin-bottom:8px}
.cls-desc{font-size:12px;color:#b8b0c8;line-height:1.6;min-height:56px}
.cls-stats{display:flex;gap:10px;font-size:11px;color:var(--dim);margin:8px 0}
.cls-passive{font-size:11px;color:#c8c0d8;border-top:1px solid var(--line);padding-top:8px;line-height:1.5}
.cls-passive b{color:var(--gold)}
.cls-skill{font-size:11px;color:#8fd3ff;margin-top:6px}
.cls-lock{margin-top:8px;font-size:11px;color:#ff8a8a}
.start-floor{text-align:center;margin-bottom:14px;font-size:12px;color:var(--dim)}
.floor-btn{margin-left:6px}
.floor-btn.sel{border-color:var(--gold);color:var(--gold)}

/* 說明 */
.help-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;margin-bottom:16px}
.help-grid div{display:flex;align-items:center;gap:10px;font-size:13px}
kbd{background:#241f32;border:1px solid #453c5c;border-bottom-width:3px;border-radius:5px;
  padding:3px 9px;font-size:11px;font-family:ui-monospace,monospace;min-width:74px;text-align:center;color:#e0d8f0}
.help-text{font-size:13px;line-height:1.8;color:#b8b0c8;border-top:1px solid var(--line);padding-top:12px}
.help-text b{color:var(--gold)}

/* 設定 */
.settings{display:flex;flex-direction:column;gap:14px;font-size:14px}
.settings label{display:flex;align-items:center;gap:12px}
.settings input[type=range]{flex:1;accent-color:#ff9a3c}
.settings .v{width:44px;text-align:right;color:var(--dim);font-size:12px}
.settings .chk{gap:8px}

/* 靈魂祭壇 */
.soul-bank{text-align:center;font-size:15px;margin-bottom:16px}
.soul-bank b{color:var(--soul);font-size:20px}
.up-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.up-card{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:8px;
  padding:10px 12px;cursor:pointer;transition:.13s;background:rgba(255,255,255,.02)}
.up-card.can:hover{border-color:var(--soul);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.5)}
.up-card.maxed{opacity:.55;cursor:default;border-color:#4a4030}
.up-icon{font-size:24px;width:32px;text-align:center}
.up-body{flex:1;min-width:0}
.up-name{font-size:14px;font-weight:700}
.up-lv{font-size:11px;color:var(--dim);font-weight:400}
.up-desc{font-size:11px;color:#a89ec0;line-height:1.5}
.up-cost{font-size:13px;font-weight:700;color:var(--soul);white-space:nowrap}

/* 升級 */
.levelup-panel{max-width:860px;background:linear-gradient(180deg,#221a10,#14121c);border-color:#5a4520}
.lvl-head{text-align:center;margin-bottom:20px}
.lvl-big{font-size:30px;font-weight:900;letter-spacing:5px;color:var(--gold);text-shadow:0 0 26px rgba(255,180,60,.5)}
.lvl-sub{font-size:13px;color:var(--dim);letter-spacing:2px}
.tal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.tal-card{border:2px solid var(--c);border-radius:10px;padding:18px 14px;text-align:center;cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.2));transition:.14s}
.tal-card:hover{transform:translateY(-6px);box-shadow:0 12px 30px rgba(0,0,0,.6);
  background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(0,0,0,.2))}
.tal-icon{font-size:32px;margin-bottom:8px;color:var(--c)}
.tal-name{font-size:16px;font-weight:900;color:var(--c);margin-bottom:6px}
.tal-desc{font-size:12px;color:#c0b8d0;line-height:1.6}

/* 背包 */
.inv-panel{max-width:1120px}
.inv-layout{display:grid;grid-template-columns:1fr 1.2fr .8fr;gap:20px}
.inv-layout .col{min-width:0}
.eq-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.eq-slot{border:1px solid var(--line);border-radius:6px;padding:6px 8px;cursor:default;background:rgba(0,0,0,.2)}
.eq-slot.filled{cursor:pointer}
.eq-slot.filled:hover{background:rgba(255,255,255,.06)}
.eq-label{font-size:9px;color:var(--dim);letter-spacing:1px}
.eq-name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-list{max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding-right:4px}
.inv-item{display:flex;align-items:center;gap:8px;border:1px solid;border-radius:6px;padding:5px 8px;
  font-size:12px;background:rgba(0,0,0,.25)}
.inv-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.inv-slot{color:var(--dim);font-size:10px}
.inv-up{color:#7bff9b;font-weight:900}
.mini{background:#2a2438;border:1px solid #453c5c;color:var(--text);border-radius:4px;padding:3px 7px;
  font-size:11px;cursor:pointer;font-family:inherit;margin-left:3px}
.mini:hover{border-color:var(--gold);color:var(--gold)}
.mini.sell:hover{border-color:#ffb03c}
.mini.poor{opacity:.5}
.stats-box{font-size:12px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.st-row{display:flex;justify-content:space-between;padding:2px 0}
.st-row span{color:var(--dim)}
.st-sep{height:1px;background:var(--line);margin:6px 0}
.gold-line{text-align:center;margin-top:10px;font-size:13px;font-weight:700;color:var(--gold)}
.tal-chips{display:flex;flex-wrap:wrap;gap:5px}
.tal-chip{font-size:11px;border:1px solid #4a4060;border-radius:12px;padding:2px 9px;color:#c8bce0;background:rgba(0,0,0,.3)}

/* 商店 */
.shop-gold{text-align:center;color:var(--gold);font-size:14px;margin-bottom:12px}
.shop-list{display:flex;flex-direction:column;gap:6px}
.shop-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:6px;
  padding:8px 12px;font-size:13px;background:rgba(0,0,0,.25)}
.shop-item>span:first-child{flex:1;font-weight:700}
.shop-sub{font-size:11px;color:var(--dim)}
.shop-item.sold{opacity:.4;justify-content:center}

/* 死亡 */
.death-panel{max-width:520px;text-align:center}
.death-title{font-size:32px;margin:0 0 6px;letter-spacing:4px;text-shadow:0 0 30px rgba(255,60,60,.4)}
.death-sub{font-size:12px;color:var(--dim);margin-bottom:20px}
.death-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;margin-bottom:18px;font-size:13px}
.death-stats div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:3px 0}
.death-stats span{color:var(--dim)}
.soul-earn{font-size:16px;margin-bottom:20px;color:var(--soul)}
.soul-earn b{font-size:24px}

/* Tooltip */
#tooltip{position:fixed;z-index:50;pointer-events:none;max-width:290px;
  background:linear-gradient(180deg,#181423,#0f0c17);border:1px solid #4a4060;border-radius:8px;
  padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.8);font-size:12px;line-height:1.6}
.tip-name{font-size:14px;font-weight:900;margin-bottom:2px}
.tip-sub{font-size:10px;color:var(--dim)}
.tip-main{color:#ffd9a0;font-weight:700;margin:4px 0}
.tip-affix{color:#8fb8ff}
.tip-unique{color:#4ade80;margin-top:6px;font-style:italic;border-top:1px solid var(--line);padding-top:6px}
.tip-cmp{margin-top:6px;font-size:11px;color:var(--dim)}
.tip-cmp.up{color:#7bff9b}
.tip-cmp.down{color:#ff8a8a}
.tip-desc{margin-top:5px;color:#c0b8d0}

/* 手機 */
@media (max-width:760px){
  #potionSlots{display:none}
  #toasts{left:8px;right:8px;top:104px;align-items:center}
  .toast{font-size:12px;padding:5px 10px;text-align:center}
  #minimapWrap{top:44px}
  #topbar{width:min(300px,52vw)}
  .inv-layout{grid-template-columns:1fr}
  .orb{width:76px;height:76px}
  #minimap{width:100px;height:100px}
  .panel{padding:18px 16px}
  .bn-name{font-size:26px}
  #potionSlots{left:104px;bottom:16px}
  .skill{width:46px;height:46px}
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#100e18}
::-webkit-scrollbar-thumb{background:#3a3450;border-radius:4px}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="orb" id="orbHp"><div class="fill" id="hpFill"></div><div class="gloss"></div><div class="txt" id="hpText"></div></div>
  <div class="orb" id="orbMp"><div class="fill" id="mpFill"></div><div class="gloss"></div><div class="txt" id="mpText"></div></div>

  <div id="topbar">
    <div id="xpBar"><div id="xpFill"></div></div>
    <div id="topInfo"><span id="lvText">Lv.1</span><span id="floorText"></span></div>
  </div>

  <div id="resbar">
    <div class="g">💰 <span id="goldText">0</span></div>
    <div class="s">💀 <span id="soulText">0</span></div>
  </div>

  <div id="minimapWrap"><canvas id="minimap" width="150" height="150"></canvas></div>

  <div id="bossbar" class="hidden">
    <div id="bossName"></div>
    <div id="bossTrack"><div id="bossFill"></div></div>
  </div>

  <div id="buffs"></div>
  <div id="potionSlots">
    <div class="pot">🧪<span id="potionCount">0</span></div>
    <div class="pot">🔵<span id="manaCount">0</span></div>
  </div>
  <div id="skillbar"></div>
  <div id="upgradeFlash" class="hidden">▲ 背包中有更好的裝備</div>
</div>

<div id="banner" class="hidden"></div>
<div id="toasts"></div>
<div id="tooltip" class="hidden"></div>
<div id="overlay" class="hidden"></div>

<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/gen.js"></script>
<script src="js/loot.js"></script>
<script src="js/skills.js"></script>
<script src="js/entity.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
